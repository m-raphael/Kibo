services:
  cyberpet-dev:
    build: .
    container_name: cyberpet-dev
    ports:
      - "1420:1420"
    volumes:
      - ./src:/app/src
      - ./packages:/app/packages
      - ./vite.config.ts:/app/vite.config.ts
      - ./tsconfig.json:/app/tsconfig.json
    environment:
      - NODE_ENV=development
      - VITE_DEV_PORT=1420
    stdin_open: true
    restart: unless-stopped
